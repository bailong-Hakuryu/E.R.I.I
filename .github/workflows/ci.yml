name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ""
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --no-cache-dir -e ".[dev]"
      - name: Install removable DeepSeek experiment
        run: python -m pip install --no-cache-dir -e experiments/deepseek-continuity-review
      - name: Clear pytest cache
        run: find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true; find . -type d -name '.pytest_cache' -exec rm -rf {} + 2>/dev/null || true
      - name: Reject committed credentials
        run: python scripts/check_secrets.py
      - name: Verify repository-local documentation links
        run: python scripts/check_docs.py
      - name: Verify project status catalog and dashboard
        run: python scripts/project_status.py --check
      - name: Verify refactoring inventory
        run: python scripts/refactoring_inventory.py --check
      - name: Static checks
        run: ruff check erii tests examples benchmarks scripts clients/typescript/scripts experiments/deepseek-continuity-review
      - name: Verify frozen source contracts
        run: python scripts/freeze_contracts.py --check
      - name: Root test suite
        run: python -m pytest -q tests
      - name: Compare refactoring benchmark when interpreter matches frozen baseline
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/run_refactoring_baseline.py
          --iterations 5
          --compare benchmarks/baselines/v0.5.0a3-refactoring-r0.json
      - name: Offline DeepSeek experiment tests
        run: python -m pytest -q experiments/deepseek-continuity-review/tests
      - name: Compile sources
        run: python -m compileall -q erii examples tests benchmarks scripts clients/typescript/scripts experiments/deepseek-continuity-review

  refactoring-benchmark:
    needs: test
    runs-on: windows-latest
    # The frozen 5-sample baseline predates the current refactoring window.
    # Shared hosted runners can shift the ~20 ms SQLite export metric past the
    # 10% gate without a real code regression, so keep this advisory until the
    # baseline is re-recorded on CI hardware.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and benchmark dependencies
        run: python -m pip install --no-cache-dir -e ".[dev]"
      - name: Enforce refactoring performance gate
        run: >-
          python benchmarks/run_refactoring_baseline.py
          --iterations 15
          --compare benchmarks/baselines/v0.5.0a3-refactoring-r0.json

  typescript-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install locked TypeScript dependencies
        working-directory: clients/typescript
        run: npm ci
      - name: Audit locked TypeScript dependencies
        working-directory: clients/typescript
        run: npm audit --audit-level=high
      - name: Lint TypeScript client
        working-directory: clients/typescript
        run: npm run lint
      - name: Build TypeScript client
        working-directory: clients/typescript
        run: npm run build
      - name: Test TypeScript client
        working-directory: clients/typescript
        run: npm test -- --coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the live Python server contract
        run: python -m pip install --no-cache-dir -e ".[server]" "httpx<1.0.0"
      - name: Verify TypeScript client against FastAPI
        run: python clients/typescript/scripts/verify_server_contract.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: ci-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package-install-windows:
    needs: package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-pattern: "*.whl"
          - python-version: "3.14"
            artifact-pattern: "*.tar.gz"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the built artifact in a clean Windows environment
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact-pattern }}
        run: |
          $artifact = Get-ChildItem -Path dist -Filter $env:ARTIFACT_PATTERN | Select-Object -First 1
          if ($null -eq $artifact) { throw "built artifact is missing" }
          python -m pip install $artifact.FullName
          $demoOutput = Join-Path $env:RUNNER_TEMP "erii-golden-demo"
          erii demo --output-dir $demoOutput
          $env:ERII_DEMO_OUTPUT = $demoOutput
          python -c "import os; from pathlib import Path; from erii import MemoryPack; root = Path(os.environ['ERII_DEMO_OUTPUT']); MemoryPack.from_json((root / 'user-a.erii').read_text(encoding='utf-8'))"
          $installSpec = "$($artifact.FullName)[server]"
          python -m pip install $installSpec httpx
          python -c "import erii; print(erii.__version__)"
          erii --help

  windows-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements*.txt
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Exercise Windows file, SQLite, and lifecycle paths
        run: |
          python -m unittest discover -s tests -p "test_storage_adapter_compatibility.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_inspection.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_backup_restore.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_process_safety.py" -v
          python -m unittest discover -s tests -p "test_archival_safety_regressions.py" -v
          python -m unittest discover -s tests -p "test_server_lifecycle.py" -v

  longitudinal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run all fixed trajectories on FileStorage and SQLite
        run: |
          mkdir -p longitudinal-results
          python benchmarks/run_longitudinal.py \
            --adapter both \
            --scenario all \
            --output longitudinal-results/v0.4.0-longitudinal.json
      - uses: actions/upload-artifact@v4
        with:
          name: longitudinal-${{ github.run_id }}-${{ github.run_attempt }}
          path: longitudinal-results/*.json
          if-no-files-found: error
          retention-days: 30
