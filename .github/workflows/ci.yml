name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: ruff check erii tests examples benchmarks scripts
      - name: Verify frozen source contracts
        run: python scripts/freeze_contracts.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q erii examples tests benchmarks scripts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: ci-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package-install-windows:
    needs: package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-pattern: "*.whl"
          - python-version: "3.14"
            artifact-pattern: "*.tar.gz"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the built artifact in a clean Windows environment
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact-pattern }}
        run: |
          $artifact = Get-ChildItem -Path dist -Filter $env:ARTIFACT_PATTERN | Select-Object -First 1
          if ($null -eq $artifact) { throw "built artifact is missing" }
          python -m pip install $artifact.FullName
          $demoOutput = Join-Path $env:RUNNER_TEMP "erii-golden-demo"
          erii demo --output-dir $demoOutput
          $env:ERII_DEMO_OUTPUT = $demoOutput
          python -c "import os; from pathlib import Path; from erii import MemoryPack; root = Path(os.environ['ERII_DEMO_OUTPUT']); MemoryPack.from_json((root / 'user-a.erii').read_text(encoding='utf-8'))"
          $installSpec = "$($artifact.FullName)[server]"
          python -m pip install $installSpec httpx
          python -c "import erii; print(erii.__version__)"
          erii --help

  windows-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Exercise Windows file, SQLite, and lifecycle paths
        run: |
          python -m unittest discover -s tests -p "test_storage_adapter_compatibility.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_inspection.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_backup_restore.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_process_safety.py" -v
          python -m unittest discover -s tests -p "test_archival_safety_regressions.py" -v
          python -m unittest discover -s tests -p "test_server_lifecycle.py" -v

  longitudinal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run all fixed trajectories on FileStorage and SQLite
        run: |
          mkdir -p longitudinal-results
          python benchmarks/run_longitudinal.py \
            --adapter both \
            --scenario all \
            --output longitudinal-results/v0.4.0-longitudinal.json
      - uses: actions/upload-artifact@v4
        with:
          name: longitudinal-${{ github.run_id }}-${{ github.run_attempt }}
          path: longitudinal-results/*.json
          if-no-files-found: error
          retention-days: 30
