name: Verify source milestone

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to verify as a source milestone
        required: true
        type: string
      expected_version:
        description: Exact PEP 440 source version expected at that commit
        required: true
        type: string

concurrency:
  group: source-milestone-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.target.outputs.commit_sha }}
      expected_version: ${{ steps.target.outputs.expected_version }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Validate source milestone target
        id: target
        env:
          REQUESTED_COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          REQUESTED_VERSION: ${{ github.event.inputs.expected_version }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error title=Invalid source milestone::a full 40-character commit SHA is required"
            exit 1
          fi
          if [[ ! "${REQUESTED_VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,63}$ ]]; then
            echo "::error title=Invalid source version::a safe exact expected version is required"
            exit 1
          fi
          echo "commit_sha=${REQUESTED_COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "expected_version=${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify checkout and source identity
        id: identity
        env:
          EXPECTED_VERSION: ${{ steps.target.outputs.expected_version }}
          REQUESTED_COMMIT_SHA: ${{ steps.target.outputs.commit_sha }}
        run: |
          set -euo pipefail
          checkout_target="$(git rev-parse HEAD)"
          if [ "${checkout_target,,}" != "${REQUESTED_COMMIT_SHA,,}" ]; then
            echo "::error title=Checkout mismatch::requested=${REQUESTED_COMMIT_SHA}, checkout=${checkout_target}"
            exit 1
          fi
          source_version="$(python -c "import runpy; print(runpy.run_path('erii/_version.py')['__version__'])")"
          if [ "${source_version}" != "${EXPECTED_VERSION}" ]; then
            echo "::error title=Source version mismatch::expected=${EXPECTED_VERSION}, actual=${source_version}"
            exit 1
          fi
          echo "version=${source_version}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: ruff check erii tests examples benchmarks scripts
      - name: Verify frozen source contracts
        run: python scripts/freeze_contracts.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q erii examples tests benchmarks scripts

  longitudinal:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run all fixed trajectories on FileStorage and SQLite
        run: |
          mkdir -p longitudinal-results
          python benchmarks/run_longitudinal.py \
            --adapter both \
            --scenario all \
            --output longitudinal-results/v0.4.0-longitudinal.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-verification-longitudinal-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: longitudinal-results/v0.4.0-longitudinal.json
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [preflight, verify, longitudinal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build wheel and source distribution for verification
        run: |
          set -euo pipefail
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-verification-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: [preflight, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-glob: "dist/*.whl"
          - python-version: "3.14"
            artifact-glob: "dist/*.tar.gz"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-verification-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify hashes and clean installation
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact-glob }}
          SOURCE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          artifact="$(compgen -G "${ARTIFACT_GLOB}" | head -n 1)"
          test -n "${artifact}"
          python -m pip install "${artifact}"
          export ERII_DEMO_OUTPUT="${RUNNER_TEMP}/erii-golden-demo"
          erii demo --output-dir "${ERII_DEMO_OUTPUT}"
          python -c "import os; from pathlib import Path; from erii import MemoryPack; root = Path(os.environ['ERII_DEMO_OUTPUT']); MemoryPack.from_json((root / 'user-a.erii').read_text(encoding='utf-8'))"
          python -m pip install "${artifact}[server]" httpx
          python -c "import erii, os; assert erii.__version__ == os.environ['SOURCE_VERSION']"
          python -c "import os, tempfile; from fastapi.testclient import TestClient; from erii.server.app import app, configure_engine, configure_server_access; directory = tempfile.TemporaryDirectory(); engine = configure_engine(directory.name); configure_server_access('source-smoke-key-' + 'x' * 32); client = TestClient(app); response = client.get('/api/v1/health'); assert response.status_code == 200, response.text; assert response.json()['version'] == os.environ['SOURCE_VERSION']; client.close(); engine.close(); directory.cleanup()"
          erii --help

  smoke-windows:
    needs: [preflight, package]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-pattern: "*.whl"
          - python-version: "3.14"
            artifact-pattern: "*.tar.gz"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-verification-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and verify the source artifact on Windows
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact-pattern }}
          SOURCE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $artifact = Get-ChildItem -Path dist -Filter $env:ARTIFACT_PATTERN | Select-Object -First 1
          if ($null -eq $artifact) { throw "source verification artifact is missing" }
          python -m pip install $artifact.FullName
          $demoOutput = Join-Path $env:RUNNER_TEMP "erii-golden-demo"
          erii demo --output-dir $demoOutput
          $env:ERII_DEMO_OUTPUT = $demoOutput
          python -c "import os; from pathlib import Path; from erii import MemoryPack; root = Path(os.environ['ERII_DEMO_OUTPUT']); MemoryPack.from_json((root / 'user-a.erii').read_text(encoding='utf-8'))"
          $installSpec = "$($artifact.FullName)[server]"
          python -m pip install $installSpec httpx
          python -c "import erii, os; assert erii.__version__ == os.environ['SOURCE_VERSION']"
          erii --help
