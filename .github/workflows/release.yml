name: Release prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated prerelease tag to publish (for example v0.4.0b1)
        required: true
        type: string
  push:
    branches:
      - "codex/release-v*"
    tags:
      - "v*"

concurrency:
  group: release-prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Resolve release target
        id: target
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${REQUESTED_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${GITHUB_REF_NAME#codex/release-}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "::error title=Invalid release target::${release_tag} is not a prerelease tag"
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify annotated immutable tag
        env:
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}" 2>/dev/null || true)"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error title=Mutable release identity::${RELEASE_TAG} must be an annotated tag"
            exit 1
          fi
          tag_target="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          checkout_target="$(git rev-parse HEAD)"
          if [ "${tag_target}" != "${checkout_target}" ]; then
            echo "::error title=Tag checkout mismatch::${RELEASE_TAG} does not resolve to the checked-out commit"
            exit 1
          fi
      - name: Verify package version and release notes
        id: identity
        env:
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          package_version="$(python -c "import runpy; print(runpy.run_path('erii/_version.py')['__version__'])")"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error title=Version mismatch::tag=${tag_version}, package=${package_version}"
            exit 1
          fi
          if [ ! -f "docs/release-notes-${package_version}.md" ]; then
            echo "::error title=Missing release notes::docs/release-notes-${package_version}.md"
            exit 1
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
      - name: Refuse an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          case "${http_status}" in
            404)
              ;;
            200)
              echo "::error title=Release already exists::${RELEASE_TAG} is already a GitHub release"
              exit 1
              ;;
            *)
              echo "::error title=Release lookup failed::GitHub API returned HTTP ${http_status}"
              exit 1
              ;;
          esac

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: ruff check erii tests examples benchmarks scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q erii examples tests benchmarks scripts

  package:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build wheel and source distribution once
        run: |
          set -euo pipefail
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: [preflight, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-glob: "dist/*.whl"
          - python-version: "3.14"
            artifact-glob: "dist/*.tar.gz"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify hashes and clean installation
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact-glob }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          artifact="$(compgen -G "${ARTIFACT_GLOB}" | head -n 1)"
          test -n "${artifact}"
          python -m pip install "${artifact}[server]" httpx
          python -c "import erii, os; assert erii.__version__ == os.environ['RELEASE_VERSION']"
          python -c "import os, tempfile; from fastapi.testclient import TestClient; from erii.server.app import app, configure_engine, configure_server_access; directory = tempfile.TemporaryDirectory(); engine = configure_engine(directory.name); configure_server_access('release-smoke-key-' + 'x' * 32); client = TestClient(app); response = client.get('/api/v1/health'); assert response.status_code == 200, response.text; assert response.json()['version'] == os.environ['RELEASE_VERSION']; client.close(); engine.close(); directory.cleanup()"
          erii --help

  smoke-windows:
    needs: [preflight, package]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            artifact-pattern: "*.whl"
          - python-version: "3.14"
            artifact-pattern: "*.tar.gz"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and verify the immutable artifact on Windows
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact-pattern }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $artifact = Get-ChildItem -Path dist -Filter $env:ARTIFACT_PATTERN | Select-Object -First 1
          if ($null -eq $artifact) { throw "release artifact is missing" }
          $installSpec = "$($artifact.FullName)[server]"
          python -m pip install $installSpec httpx
          python -c "import erii, os; assert erii.__version__ == os.environ['RELEASE_VERSION']"
          erii --help

  publish:
    needs: [preflight, smoke, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish the verified files as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          local_tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          remote_tag_object="$(git ls-remote --tags --refs origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          test -n "${remote_tag_object}"
          test "${local_tag_object}" = "${remote_tag_object}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false \
            --title "E.R.I.I. ${RELEASE_TAG}" \
            --notes-file "docs/release-notes-${RELEASE_VERSION}.md"
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
          published_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for file in dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt; do
            grep -Fqx "$(basename "${file}")" <<<"${published_assets}"
          done
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease \
            --latest=false
