[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erii"
dynamic = ["version"]
description = "Character continuity and long-term memory kernel for AI agents"
readme = "README.md"
authors = [
    { name = "bailong-Hakuryu" }
]
keywords = [
    "ai-agents",
    "character-continuity",
    "long-term-memory",
    "persona",
    "relationship-memory",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bailong-Hakuryu/E.R.I.I"
Repository = "https://github.com/bailong-Hakuryu/E.R.I.I"
Documentation = "https://github.com/bailong-Hakuryu/E.R.I.I/tree/main/docs"
Issues = "https://github.com/bailong-Hakuryu/E.R.I.I/issues"
Changelog = "https://github.com/bailong-Hakuryu/E.R.I.I/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
vector = ["chromadb>=0.4.0", "numpy>=1.20.0"]
all = ["openai>=1.0.0", "fastapi>=0.100.0", "uvicorn>=0.20.0", "chromadb>=0.4.0", "numpy>=1.20.0", "pytest>=7.0.0"]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.scripts]
erii = "erii.server.app:cli_main"

[tool.setuptools.dynamic]
version = {attr = "erii._version.__version__"}

[tool.setuptools.packages.find]
include = ["erii*"]
exclude = ["tests*", "examples*", "example_memory*", "example_custom_llm_memory*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
